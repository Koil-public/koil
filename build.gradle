plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
    id 'java'
    id 'signing'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    id 'org.jetbrains.kotlin.jvm' version '1.8.10'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

def devLaunchProperties = new Properties()
def devLaunchPropertiesFile = file("dev-launch.properties")
if (devLaunchPropertiesFile.isFile()) {
    devLaunchPropertiesFile.withInputStream { stream ->
        devLaunchProperties.load(stream)
    }
}

def devUsername = devLaunchProperties.getProperty("username", "Dev").trim()
def devUuid = devLaunchProperties.getProperty("uuid", "").trim()
def devJavaExecutable = devLaunchProperties.getProperty("javaExecutable", "").trim()
def turboVecOs = System.getProperty("os.name", "").toLowerCase(Locale.ROOT)
def turboVecLibraryFileName = turboVecOs.contains("win") ? "koil_turbovec.dll"
        : turboVecOs.contains("mac") ? "libkoil_turbovec.dylib" : "libkoil_turbovec.so"
def turboVecCargoFileName = turboVecOs.contains("win") ? "cargo.exe" : "cargo"
def turboVecCargoHome = System.getenv("CARGO_HOME") ?: "${System.getProperty('user.home')}/.cargo"
def turboVecCargoExecutable = file("${turboVecCargoHome}/bin/${turboVecCargoFileName}")
def localTurboVecBridge = file("src/main/resources/native/turbovec-bridge/target/release/${turboVecLibraryFileName}")
def turboVecDevelopmentLibrary = project.hasProperty('koilTurboVecLibrary')
        ? project.property('koilTurboVecLibrary').toString()
        : localTurboVecBridge.absolutePath

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://repo.spongepowered.org/maven/' }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://jitpack.io' }

    maven { url 'https://maven.google.com/' }
    maven { url 'https://plugins.gradle.org/m2/' }
    maven { url 'https://raw.githubusercontent.com/umjammer/vavi-sound/master/repo' }

    maven { url "https://cursemaven.com/" }

    mavenCentral()
    mavenLocal()

    jcenter()

    flatDir {
        dirs 'libs'
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.lwjgl") {
            details.useVersion("3.3.1")
            details.because("Minecraft 1.20.1 runtime compatibility")
        }
    }
}

dependencies {
    // Minecraft dependencies
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation("net.fabricmc:fabric-language-kotlin:1.12.3+kotlin.2.0.21")
    modCompileOnly "dev.emi:emi-fabric:1.1.18+1.20.1"
    modCompileOnly "mezz.jei:jei-1.20.1-fabric-api:15.20.0.135"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.1.785"

    // OkHttp and Gson dependencies
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
    include 'com.squareup.okhttp3:okhttp:4.9.2'
    implementation 'com.squareup.okio:okio:3.4.0'
    include 'com.squareup.okio:okio:3.4.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    include 'com.google.code.gson:gson:2.8.9'
    implementation 'org.sejda.imageio:webp-imageio:0.1.6'
    include 'org.sejda.imageio:webp-imageio:0.1.6'
    implementation 'org.yaml:snakeyaml:2.3'
    include 'org.yaml:snakeyaml:2.3'
    implementation 'org.scilab.forge:jlatexmath:1.0.7'
    include 'org.scilab.forge:jlatexmath:1.0.7'
    implementation 'org.xerial:sqlite-jdbc:3.53.0.0'
    include 'org.xerial:sqlite-jdbc:3.53.0.0'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    implementation 'org.apache.maven:maven:3.6.3'
    implementation 'org.avaje.ebeanorm:avaje-ebeanorm:4.7.3'


}

sourceSets {
    main {
        // Sync clients retain conflicting source snapshots for recovery; they are never compilable production sources.
        java.exclude '**/*.sync-conflict-*.java'
    }
    docIndex {
        java.srcDir 'tools/docindex/src/main/java'
    }
}

tasks.register('buildTurboVecBridge', Exec) {
    group = 'build'
    description = 'Builds the host TurboVec JNI bridge used by development launches.'
    workingDir file('src/main/resources/native/turbovec-bridge')
    onlyIf {
        if (turboVecCargoExecutable.isFile()) return true
        logger.lifecycle('TurboVec development bridge skipped: Cargo is unavailable; using Flat Java fallback.')
        false
    }
    commandLine turboVecCargoExecutable.absolutePath, 'build', '--release', '--locked'
    environment 'CARGO_TARGET_DIR', file('src/main/resources/native/turbovec-bridge/target').absolutePath
    inputs.files(fileTree(workingDir) {
        include 'Cargo.toml', 'Cargo.lock', 'src/**'
    }).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(localTurboVecBridge)
}

configurations.named('docIndexImplementation') {
    // docIndex deliberately uses only the Java 17 compiler/tree APIs. Keeping the
    // classpath empty makes the architecture index reproducible and offline.
}

def docIndexMarkdownOutputs = [
        'index.md',
        'architecture.md',
        'systems.md',
        'dependencies.md',
        'execution-flows.md',
        'source-map.md',
        'configs.md',
        'commands.md',
        'mixins.md',
        'screens.md',
        'registries.md'
].collect { layout.projectDirectory.file("docs/${it}") }

tasks.register('docIndex', JavaExec) {
    group = 'documentation'
    description = 'Generates and validates Koil architecture documentation from source.'
    dependsOn tasks.named('compileJava'), tasks.named('compileDocIndexJava')
    classpath = sourceSets.docIndex.runtimeClasspath
    mainClass = 'com.spirit.docindex.DocIndexMain'
    args layout.projectDirectory.asFile.absolutePath

    inputs.files(fileTree('src/main/java') {
        include '**/*.java'
        exclude '**/*.sync-conflict-*.java'
    })
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree('src/main/kotlin') { include '**/*.kt' })
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree('src/main/resources') {
        include '**/*.json', '**/*.mixins.json', '**/*.accesswidener', '**/*.ktl'
        exclude 'native/turbovec-bridge/target/**'
    }).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files('build.gradle', 'settings.gradle', 'gradle.properties', 'docIndex.json')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.files(docIndexMarkdownOutputs)
    outputs.dir(layout.projectDirectory.dir('docs/generated'))
}

tasks.register('docIndexValidate', JavaExec) {
    group = 'verification'
    description = 'Validates the existing generated Koil documentation index.'
    dependsOn tasks.named('compileDocIndexJava')
    classpath = sourceSets.docIndex.runtimeClasspath
    mainClass = 'com.spirit.docindex.DocIndexMain'
    args layout.projectDirectory.asFile.absolutePath, '--validate-only'
}

tasks.named('build') {
    dependsOn tasks.named('docIndex')
}

