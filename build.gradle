    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.spirit.koil.api.model.codeintelligence.CodeIntelligenceProof'
}

tasks.register('runCodebaseMemoryIntegrationProof', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.spirit.koil.api.model.codeintelligence.CodebaseMemoryIntegrationProof'
    jvmArgs '-Dkoil.codebaseMemory.runtimeRoot=' + file('run/koil/sys/model/runtime').absolutePath
    if (project.hasProperty('codebaseMemoryExecutable')) {
        jvmArgs '-Dkoil.codebaseMemory.executable=' + project.property('codebaseMemoryExecutable')
    }
    if (project.hasProperty('skipCodebaseMemoryBenchmark')) {
        jvmArgs '-Dkoil.codebaseMemory.skipBenchmark=true'
    }
