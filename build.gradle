tasks.register('runGigatokenDifferentialProof', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.spirit.koil.api.model.testing.GigatokenDifferentialProof'
    def bridge = providers.gradleProperty('gigatokenBridge')
    def tokenizer = providers.gradleProperty('gigatokenTokenizer')
    def reference = providers.gradleProperty('colibriTokenizerReference')
    onlyIf {
        if (!(bridge.isPresent() && tokenizer.isPresent() && reference.isPresent())) {
            logger.lifecycle('Skipping real Gigatoken differential proof; pass -PgigatokenBridge, -PgigatokenTokenizer, and -PcolibriTokenizerReference.')
            return false
        }
        true
    }
    doFirst {
        args bridge.get(), tokenizer.get(), reference.get()
    }
}

tasks.register('runColibriRuntimeIntegrationProof', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.spirit.koil.api.model.install.ColibriRuntimeIntegrationProof'
    def fixture = providers.gradleProperty('colibriSourceDirectory')
    onlyIf {
        if (!fixture.isPresent()) {
            logger.lifecycle('Skipping pinned Colibri integration proof; pass -PcolibriSourceDirectory=<upstream c directory>.')
            return false
        }
        true
    }
    doFirst { args fixture.get() }
}

