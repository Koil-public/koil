            client()
            name "Minecraft Client"
            runDir "run"
            // IntelliJ uses the checked-in Gradle run profile in .run/. Direct Loom
            // profiles encode spaces in this project's path incorrectly on this setup.
            ideConfigGenerated false
            programArgs "--username", devUsername
            if (!devUuid.isEmpty()) {
                programArgs "--uuid", devUuid
            }
            // Development-only override for a locally compiled JNI bridge. Release
            // builds still require a hash-qualified managed native artifact.
            if (!turboVecDevelopmentLibrary.isEmpty()) {
                vmArg '-Dkoil.turbovec.library=' + turboVecDevelopmentLibrary
            }
        }
    }
}

