plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
    id 'java'
    id 'signing'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    id 'org.jetbrains.kotlin.jvm' version '1.8.10'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

def devLaunchProperties = new Properties()
def devLaunchPropertiesFile = file("dev-launch.properties")
if (devLaunchPropertiesFile.isFile()) {
    devLaunchPropertiesFile.withInputStream { stream ->
        devLaunchProperties.load(stream)
    }
}

def devUsername = devLaunchProperties.getProperty("username", "Dev").trim()
def devUuid = devLaunchProperties.getProperty("uuid", "").trim()
def devJavaExecutable = devLaunchProperties.getProperty("javaExecutable", "").trim()

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://repo.spongepowered.org/maven/' }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://jitpack.io' }

    maven { url 'https://maven.google.com/' }
    maven { url 'https://plugins.gradle.org/m2/' }
    maven { url 'https://raw.githubusercontent.com/umjammer/vavi-sound/master/repo' }

    maven { url "https://cursemaven.com/" }

    mavenCentral()
    mavenLocal()

    jcenter()

    flatDir {
        dirs 'libs'
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.lwjgl") {
            details.useVersion("3.3.1")
            details.because("Minecraft 1.20.1 runtime compatibility")
        }
    }
}

dependencies {
    // Minecraft dependencies
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation("net.fabricmc:fabric-language-kotlin:1.12.3+kotlin.2.0.21")
    modCompileOnly "dev.emi:emi-fabric:1.1.18+1.20.1"
    modCompileOnly "mezz.jei:jei-1.20.1-fabric-api:15.20.0.135"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.1.785"

    // OkHttp and Gson dependencies
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
    include 'com.squareup.okhttp3:okhttp:4.9.2'
    implementation 'com.squareup.okio:okio:3.4.0'
    include 'com.squareup.okio:okio:3.4.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    include 'com.google.code.gson:gson:2.8.9'
    implementation 'org.sejda.imageio:webp-imageio:0.1.6'
    include 'org.sejda.imageio:webp-imageio:0.1.6'
    implementation 'org.yaml:snakeyaml:2.3'
    include 'org.yaml:snakeyaml:2.3'
    implementation 'org.scilab.forge:jlatexmath:1.0.7'
    include 'org.scilab.forge:jlatexmath:1.0.7'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    implementation 'org.apache.maven:maven:3.6.3'
    implementation 'org.avaje.ebeanorm:avaje-ebeanorm:4.7.3'


}

def bundledModelDocumentation = fileTree('docs') {
    include 'systems/*'
    include 'connectors/*'
    include 'architecture/*'
    include 'test-datapacks/**'
    include 'file-map.md'
    include 'project-structure.md'
    exclude 'test-datapacks/**/*.png'
    include 'automation-capability-test-matrix.md'
    include 'issues-and-risks.md'
    include 'local-model-user-test-guide.md'
    include 'vision.md'
}
def bundledModelKnowledgeIndex = layout.buildDirectory.file(
        'generated/koilModelKnowledge/koil/model/knowledge/project-docs.index'
)

tasks.register('generateBundledModelKnowledgeIndex') {
    inputs.files(bundledModelDocumentation)
    outputs.file(bundledModelKnowledgeIndex)
    doLast {
        File output = bundledModelKnowledgeIndex.get().asFile
        output.parentFile.mkdirs()
        def docsRoot = file('docs').toPath().toAbsolutePath().normalize()
        def entries = bundledModelDocumentation.files.collect { source ->
            docsRoot.relativize(source.toPath().toAbsolutePath().normalize())
                    .toString().replace('\\', '/')
        }.sort()
        output.setText(entries.join('\n') + (entries.isEmpty() ? '' : '\n'), 'UTF-8')
    }
}

processResources {
    dependsOn tasks.named('generateBundledModelKnowledgeIndex')
    inputs.property "version", project.version
    inputs.files bundledModelDocumentation

    from(sourceSets.main.resources)

    from('docs') {
        include 'systems/*'
        include 'connectors/*'
        include 'architecture/*'
        include 'test-datapacks/**'
        include 'file-map.md'
        include 'project-structure.md'
        exclude 'test-datapacks/**/*.png'
        include 'automation-capability-test-matrix.md'
        include 'issues-and-risks.md'
        include 'local-model-user-test-guide.md'
        include 'vision.md'
        into 'koil/model/knowledge/project-docs'
    }

    from(layout.buildDirectory.dir('generated/koilModelKnowledge'))

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

tasks.withType(JavaExec).configureEach {
    if (name == "runClient" && !devJavaExecutable.isEmpty()) {
        executable = devJavaExecutable
    } else {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

def runClientRequiredClassFiles = [
        file("$buildDir/classes/java/main/com/spirit/client/gui/content/browser/ContentBrowserListRowRenderer.class"),
        file("$buildDir/classes/java/main/com/spirit/mixin/client/gui/revamp/world/MixinWorldEntry.class"),
        file("$buildDir/classes/java/main/com/spirit/koil/api/util/file/media/VisualTransportControls.class"),
        file("$buildDir/classes/java/main/com/spirit/Client.class"),
        file("$buildDir/classes/java/main/com/spirit/Main.class")
]

tasks.named("compileJava", JavaCompile).configure {
    outputs.upToDateWhen {
        runClientRequiredClassFiles.every { it.isFile() }
    }
}

tasks.register("verifyRunClientClasses") {
    dependsOn tasks.named("compileJava")
    doLast {
        def missing = runClientRequiredClassFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "runClient is missing required compiled classes: " +
                            missing.collect { it.absolutePath }.join(", ") +
                            ". Stop any running client and rerun ./gradlew compileJava."
            )
        }
    }
}

